name: R2 - Sub-module Verification & Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node.js Ecosystem Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test NestJS API submodule
        run: |
          cd 10-backend-apis/11-nestjs
          npm install --prefer-offline --no-audit
          npm test

      - name: Build TypeScript submodules
        run: |
          cd 01-vanilla/03-typescript
          npm install --prefer-offline --no-audit
          npm run build

      - name: Build Modern Framework submodules
        run: |
          for dir in 03-modern-frameworks/06-svelte 03-modern-frameworks/07-solidjs 03-modern-frameworks/08-preact 03-modern-frameworks/10-alpine; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "=== Building $dir ==="
              cd "$dir"
              npm install --prefer-offline --no-audit
              npm run build
              cd - > /dev/null
            fi
          done

      - name: Build Meta-framework submodules
        run: |
          if [ -d "04-metaframeworks/01-nextjs" ] && [ -f "04-metaframeworks/01-nextjs/package.json" ]; then
            echo "=== Building 04-metaframeworks/01-nextjs ==="
            cd 04-metaframeworks/01-nextjs
            npm install --prefer-offline --no-audit
            npm run build
            cd - > /dev/null
          fi

  go-tests:
    name: Go Ecosystem Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Test Go Gin submodule
        run: |
          cd 10-backend-apis/06-go-gin
          go mod download
          go test -v ./...

      - name: Test Go Echo submodule
        run: |
          cd 10-backend-apis/07-go-echo
          go mod download
          go test -v ./...

  rust-tests:
    name: Rust Ecosystem Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust Actix API submodule
        run: |
          cd 10-backend-apis/10-rust-actix
          cargo test

      - name: Check Rust Bevy Game Engine submodule
        run: |
          cd 09-game-engines/05-bevy
          cargo check

      - name: Check Rust Tauri Desktop submodule
        run: |
          if [ -d "08-desktop/03-tauri-vue/src-tauri" ]; then
            cd 08-desktop/03-tauri-vue/src-tauri
          elif [ -d "08-desktop/05-tauri-vue/src-tauri" ]; then
            cd 08-desktop/05-tauri-vue/src-tauri
          fi
          cargo check

  python-tests:
    name: Python Ecosystem Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python submodules compilation
        run: |
          DIRS=""
          for d in 10-backend-apis/03-fastapi 10-backend-apis/04-python-fastapi 10-backend-apis/02-django 10-backend-apis/05-python-django 10-backend-apis/04-flask 10-backend-apis/08-python-flask 10-pwa/01-vanilla-pwa 10-pwa/04-flask-pwa 08-desktop/10-pyqt6 08-desktop/11-tkinter 08-desktop/12-kivy; do
            if [ -d "$d" ]; then
              DIRS="$DIRS $d"
            fi
          done
          python -m py_compile $(find $DIRS -name "*.py")

  dotnet-tests:
    name: .NET Ecosystem Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build ASP.NET Core API submodule
        run: |
          if [ -f "10-backend-apis/05-aspnet-core-api/TodoApi.csproj" ]; then
            dotnet build 10-backend-apis/05-aspnet-core-api/TodoApi.csproj
          elif [ -f "10-backend-apis/09-csharp-aspnetcore/TodoApi.csproj" ]; then
            dotnet build 10-backend-apis/09-csharp-aspnetcore/TodoApi.csproj
          fi

      - name: Build Blazor submodules
        run: |
          for proj in 11-blazor/*/*.csproj; do
            if [ -f "$proj" ]; then
              dotnet build "$proj"
            fi
          done

      - name: Build .NET Desktop submodules
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            for proj in 08-desktop/*/*.csproj 08-desktop/*/*/*.csproj; do
              if [ -f "$proj" ]; then
                dotnet build "$proj"
              fi
            done
          else
            echo "Skipping Windows-only WPF/WinForms builds on Linux runner."
          fi

  flutter-tests:
    name: Flutter Ecosystem Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Test Flutter submodules
        run: |
          for dir in 06-mobile-crossplatform/03-flutter-basic 06-mobile-crossplatform/01-flutter 06-mobile-crossplatform/06-flutter-bloc 06-mobile-crossplatform/07-flutter-provider 06-mobile-crossplatform/04-flutter-riverpod 14-state-management/01-flutter-riverpod; do
            if [ -d "$dir" ] && [ -f "$dir/pubspec.yaml" ]; then
              echo "=== Testing $dir ==="
              cd "$dir"
              flutter pub get
              if [ -d "test" ]; then
                flutter test
              else
                flutter analyze
              fi
              cd - > /dev/null
            fi
          done

  java-tests:
    name: Java & Kotlin Ecosystem Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Test Java Spring Boot API submodule
        run: |
          if [ -d "10-backend-apis/01-spring-boot" ]; then
            cd 10-backend-apis/01-spring-boot
            mvn test
          elif [ -d "10-backend-apis/01-java-spring-boot" ]; then
            cd 10-backend-apis/01-java-spring-boot
            mvn test
          fi

  blockchain-tests:
    name: Blockchain Ecosystem Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test EVM Solidity Smart Contracts
        run: |
          cd 12-blockchain/01-evm-solidity
          npm install --prefer-offline --no-audit
          npm test

  test-summary:
    name: Sub-module Testing Summary Gate
    runs-on: ubuntu-latest
    needs:
      - node-tests
      - go-tests
      - rust-tests
      - python-tests
      - dotnet-tests
      - flutter-tests
      - java-tests
      - blockchain-tests
    steps:
      - name: Confirm All Tests Passed
        run: echo "🎉 All R2 Sub-module Verification & Testing workflows passed successfully!"
