name: R3 - Build & Automated Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build Release Artifacts & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package release archives and generate SHA256SUMS
        run: python .github/scripts/package_release.py --output-dir release_assets

      - name: Verify checksums
        run: |
          echo "=== Release Artifact Checksums ==="
          cat release_assets/SHA256SUMS

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/todolist-web-apps.zip
            release_assets/todolist-backend-apis.zip
            release_assets/todolist-mobile-desktop.zip
            release_assets/todolist-blockchain-games.zip
            release_assets/todolist-full-repo.tar.gz
            release_assets/SHA256SUMS
          generate_release_notes: true
